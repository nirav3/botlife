services:
  - type: web
    name: botlife-api
    runtime: node
    plan: free
    # --include=dev: NODE_ENV=production (below) makes plain `npm install`
    # skip devDependencies, which would drop typescript/vite mid-build.
    buildCommand: npm install --include=dev && npm run build:all
    # Pre-Deploy Command isn't available on Render's free plan, so migrations
    # run here instead. `prisma migrate deploy` is idempotent — safe to run
    # on every start, including the free tier's frequent sleep/wake cycles.
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "500"
      # Secrets — set these in the Render dashboard, not here:
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      # From https://resend.com — without this, password-reset links are
      # logged instead of emailed, so set it before relying on that flow.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # The deployed app's public URL, used to build links in emails.
      - key: APP_URL
        value: https://botlife-api.onrender.com
      # Render generates and stores this itself — you'll never see or need
      # to supply the actual value.
      - key: JWT_SECRET
        generateValue: true
      # Same value as GOOGLE_CLIENT_ID above, but Vite only exposes
      # VITE_-prefixed vars to client code at build time — needs to be set
      # even though it isn't secret, since the client bundle is built here.
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
