name: Keep Render API warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sf --max-time 60 https://botlife-api.onrender.com/health \
            && echo "✅ API is warm" \
            || echo "⚠️ Ping failed (cold start in progress or service down)"
